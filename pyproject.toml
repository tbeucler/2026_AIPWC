[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aipwc-figures"
version = "0.1.0"
description = "Reproduce the Typhoon Saola and model-throughput figures for AI Pathways from Weather to Climate."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "cartopy>=0.24,<0.26",
    "matplotlib>=3.9,<3.11",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "rasterio>=1.4,<2",
    "statsmodels>=0.14,<0.15",
]

[project.scripts]
aipwc-figures = "aipwc_figures.cli:main"

[dependency-groups]
dev = [
    "pypdf>=5,<7",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
